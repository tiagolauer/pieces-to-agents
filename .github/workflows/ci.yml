name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20.11', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Reject byte order marks
        run: |
          found=$(git ls-files -z | xargs -0 grep -lI $'\xEF\xBB\xBF' 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Files start with a UTF-8 BOM, which breaks JSON and module parsing:"
            echo "$found"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
